workflow:
  mode: sequential          # sequential | supervisor
  human_review_enabled: true
  evaluation_threshold: 0.75

agents:
  requirement: true
  scenario: true
  testcase: false
  evaluation: false
  playwright: false
  execution: false
  report: false

llm:
  provider: openai          # openai | anthropic | ollama | groq
  model: gpt-4o-mini
  temperature: 0.2

browser:
  type: chromium            # chromium | firefox | webkit
  headless: true

rag:
  enabled: false
  vector_db_provider: chroma
  vector_db_path: ./data/vector_store

generation:
  scenario_count: 3